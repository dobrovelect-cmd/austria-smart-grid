name: Diagnose EbUtilities capacity source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe API method and POST payload formats
        shell: bash
        run: |
          set +e
          URL="https://www.ebutilities.at/api/powerstations/list"
          probe() {
            LABEL="$1"
            shift
            echo
            echo "===== $LABEL ====="
            curl --silent --show-error --max-time 45 \
              --user-agent "Mozilla/5.0 (compatible; SMART-Grid-Austria/1.0)" \
              --dump-header /tmp/headers.txt \
              --output /tmp/body.txt \
              --write-out "HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nURL=%{url_effective}\n" \
              "$@" "$URL"
            grep -iE '^(HTTP/|allow:|content-type:|server:|location:|date:)' /tmp/headers.txt || true
            echo "--- response body (first 5000 bytes) ---"
            head -c 5000 /tmp/body.txt
            echo
          }
          probe "GET" --request GET
          probe "POST empty JSON" --request POST -H "Content-Type: application/json" --data '{}'
          probe "POST empty body" --request POST -H "Content-Type: application/json" --data ''
          probe "POST form encoded empty" --request POST -H "Content-Type: application/x-www-form-urlencoded" --data ''
          probe "POST JSON page 1" --request POST -H "Content-Type: application/json" --data '{"page":1}'

      - name: Inspect the official page and JavaScript bundles
        run: |
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page_url = "https://www.ebutilities.at/verfuegbare-netzanschlusskapazitaeten"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; SMART-Grid-Austria/1.0)"}

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.links = []
                  self.in_title = False
                  self.title = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "script" and attrs.get("src"):
                      self.scripts.append(urljoin(page_url, attrs["src"]))
                  if tag.lower() == "link" and attrs.get("href"):
                      self.links.append(urljoin(page_url, attrs["href"]))
                  if tag.lower() == "title":
                      self.in_title = True
              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)

          def fetch(url, limit=10_000_000):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as res:
                  data = res.read(limit + 1)[:limit]
                  return res.status, res.headers, data

          status, response_headers, html = fetch(page_url)
          text = html.decode("utf-8", errors="replace")
          parser = Parser()
          parser.feed(text)
          print(f"PAGE_STATUS={status}")
          print(f"PAGE_TITLE={''.join(parser.title).strip()}")
          print(f"SCRIPT_COUNT={len(parser.scripts)}")
          for item in parser.scripts:
              print(f"SCRIPT_URL={item}")
          print(f"PAGE_BYTES={len(html)}")
          print(f"PAGE_HAS_API_ROUTE={'/api/' in text}")

          route_pattern = re.compile(r"""['"](/api/[A-Za-z0-9_./?=&-]+)['"]""")
          for script_url in parser.scripts:
              try:
                  js_status, js_headers, js_data = fetch(script_url, 20_000_000)
                  js = js_data.decode("utf-8", errors="replace")
                  print(f"\n===== BUNDLE {script_url} status={js_status} bytes={len(js_data)} =====")
                  for route in sorted(set(route_pattern.findall(js))):
                      print(f"API_ROUTE={route}")
                  for needle in ("powerstations", "availableCapacity", "substationName",
                                 "powerstationId", "axios", "fetch("):
                      positions = [m.start() for m in re.finditer(re.escape(needle), js, re.I)]
                      if positions:
                          print(f"TOKEN {needle}: {len(positions)} match(es)")
                          for pos in positions[:3]:
                              print(js[max(0, pos - 250):pos + 700].replace("\\n", " ")[:1000])
              except Exception as exc:
                  print(f"BUNDLE_FETCH_FAILED {script_url}: {exc}")
          PY
